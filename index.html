<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookShelf - Gerencie sua biblioteca pessoal" />
    <title>BookShelf - Biblioteca Pessoal</title>
  </head>
  <body>
    <script>
      // Restore the original route saved by the GitHub Pages 404.html fallback.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect) {
          history.replaceState(null, '', location.pathname.replace(/\/$/, '') + redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

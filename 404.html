<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>BookShelf</title>
    <script>
      // GitHub Pages has no native client-side routing. Redirect any unknown
      // route back to index, preserving the path so BrowserRouter can take over.
      var basePath = '/bookshelf-frontend';
      sessionStorage.redirect = location.pathname.slice(basePath.length) + location.search + location.hash;
      location.replace(basePath + '/');
    </script>
  </head>
  <body></body>
</html>
